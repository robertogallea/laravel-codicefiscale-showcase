name: Refresh codice fiscale birthplace data

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  mirror:
    # ANPR's WAF rejects requests from Render's network but not from
    # GitHub's runners, so the runner fetches the sources and mirrors
    # them to a release that the Render app downloads from instead.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: anpr-sources
    steps:
      - name: Download the ANPR sources
        run: |
          curl --fail --show-error --silent --retry 3 --retry-all-errors --connect-timeout 30 \
            --output ANPR_archivio_comuni.csv \
            https://www.anagrafenazionale.interno.it/wp-content/uploads/ANPR_archivio_comuni.csv
          curl --fail --show-error --silent --retry 3 --retry-all-errors --connect-timeout 30 \
            --output tabella_2_statiesteri.xlsx \
            https://www.anagrafenazionale.interno.it/wp-content/uploads/tabella_2_statiesteri.xlsx

      - name: Sanity-check the downloads
        run: |
          # Guard against mirroring an HTML error page served with a 200.
          head -c 200 ANPR_archivio_comuni.csv | grep -qi 'codistat' \
            || { echo "ANPR_archivio_comuni.csv doesn't look like the comuni CSV"; head -c 500 ANPR_archivio_comuni.csv; exit 1; }
          [ "$(head -c 2 tabella_2_statiesteri.xlsx)" = "PK" ] \
            || { echo "tabella_2_statiesteri.xlsx isn't an xlsx (zip) file"; exit 1; }
          ls -l ANPR_archivio_comuni.csv tabella_2_statiesteri.xlsx

      - name: Publish the mirror release assets
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --latest=false \
                 --title "ANPR source mirror" \
                 --notes "Weekly mirror of the ANPR birthplace sources, refreshed by update-codicefiscale-data.yml. Not a software release."
          gh release upload "$RELEASE_TAG" --clobber ANPR_archivio_comuni.csv tabella_2_statiesteri.xlsx

  refresh:
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger the protected Render refresh endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
          UPDATE_TOKEN: ${{ secrets.CODICEFISCALE_UPDATE_TOKEN }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-all-errors --connect-timeout 30 --max-time 480 \
            --request POST \
            --header "X-Codicefiscale-Update-Token: ${UPDATE_TOKEN}" \
            "${RENDER_APP_URL%/}/internal/jobs/codice-fiscale-update"
