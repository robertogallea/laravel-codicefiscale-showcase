services:
  - type: web
    name: laravel-codicefiscale-showcase
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: CODICEFISCALE_UPDATE_TOKEN
        sync: false
      - key: CODICEFISCALE_MUNICIPALITIES_SOURCE
        value: https://github.com/robertogallea/laravel-codicefiscale-showcase/releases/download/anpr-sources/ANPR_archivio_comuni.csv
      - key: CODICEFISCALE_COUNTRIES_SOURCE
        value: https://github.com/robertogallea/laravel-codicefiscale-showcase/releases/download/anpr-sources/tabella_2_statiesteri.xlsx
